{% extends 'base.html' %}{% block content %}<h1 class="h3">Message details</h1><p>{{batch.description}} · {{template.name}}</p>
<form method="post" class="card card-body"><input type="hidden" name="sales_csrf" value="{{session.sales_csrf}}"><label class="form-label" for="audience">Audience</label><select class="form-select mb-3" name="audience" id="audience"><option value="group">Select clients or all clients</option><option value="individual">One individual client</option></select>
<label class="form-label">Company / branch</label><p class="form-control bg-light">{{batch.company.company_name}}</p><label class="form-label">Documents go to</label><p class="form-control bg-light">{{batch.filing_branch or 'No document recipient configured for this branch'}}</p>
<label class="form-label" for="product">Policy product</label><select class="form-select mb-3" id="product" name="product_id" required><option value="">Choose a product</option>{% for p in products %}<option value="{{p.id}}">{{p.product_name}} · {{p.plan_name or ''}} · R{{p.monthly_premium}} per month · R{{p.cover_amount}} cover</option>{% endfor %}</select><button class="btn btn-primary align-self-start">Preview</button></form>{% endblock %}
