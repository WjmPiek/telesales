<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>Martins Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/martins_logo.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/martins_logo.png') }}">
  <meta property="og:title" content="Martins System">
  <meta property="og:image" content="{{ url_for('static', filename='img/martins_logo.png', _external=True) }}">
  <link href="{{ url_for('static', filename='css/martins-theme.css') }}?v=20260802" rel="stylesheet">
</head>
<body>
<main class="login-page">
  <section class="login-card login-card-attendance" aria-labelledby="loginTitle">
    <header class="login-hero">
      <img class="login-logo login-logo-attendance" src="{{ url_for('static', filename='img/martins_logo.png') }}" alt="Martins">
      <div class="login-brand">
        <h1 id="loginTitle" class="login-brand-name">Martins System</h1>
        <div class="login-module-name">Attendance Register</div>
      </div>
    </header>

    <div class="login-body">

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="login-alerts">
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form class="login-form" method="post">
        <div class="mb-3">
          <label class="form-label" for="username">Email or username</label>
          <input id="username" class="form-control" name="email" type="text" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <div class="password-row">
            <input id="password" class="form-control" name="password" type="password" autocomplete="current-password" required>
            <button class="btn btn-password-toggle" type="button" aria-controls="password" aria-label="Show password">Show</button>
          </div>
        </div>
        <button class="btn btn-primary login-submit" type="submit">Login</button>
      </form>

      <div class="login-links" aria-label="Account links">
        <a href="#forgot-password">Forgot password?</a>
        <a href="{{ url_for('auth.register') }}">Register account</a>
      </div>
    </div>
  </section>
</main>
<script>
document.querySelector('.btn-password-toggle').addEventListener('click', function () {
  var password = document.getElementById('password');
  var isHidden = password.type === 'password';
  password.type = isHidden ? 'text' : 'password';
  this.textContent = isHidden ? 'Hide' : 'Show';
  this.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
});
</script>
</body>
</html>
