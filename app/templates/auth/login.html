<!doctype html>
<html>
<head>
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/martins-theme.css', v='20260802-login-uniform-v2') }}">
</head>
<body class="bg-light martins-auth-page">
<div class="martins-auth-shell">
      <div class="card shadow martins-login-card">
        <div class="card-header text-white martins-login-header">
          <strong>Martins Login</strong>
          <span>Telesales</span>
        </div>
        <div class="martins-auth-brand">
          <img src="{{ url_for('static', filename='img/martins_logo.png') }}" alt="Martins logo">
          <strong>Martins System</strong>
          <span>Telesales</span>
        </div>
        <div class="card-body martins-login-body">
          <h1>Login</h1>
          <p class="muted">Sign in to the Martins System telesales module.</p>
          <form method="post">
            <label>Email</label>
            <input class="form-control mb-2" name="email" autocomplete="username" autofocus>
            <label>Password</label>
            <input class="form-control mb-3" name="password" type="password" autocomplete="current-password">
            <button class="btn btn-primary" type="submit">Log in</button>
          </form>
          <p class="muted">No account yet? <a class="link" href="{{ url_for('auth.register') }}">Register here</a></p>
        </div>
      </div>
</div>
</body>
</html>
