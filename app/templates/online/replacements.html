</head><body style="font:18px Arial;max-width:650px;padding:24px;margin:auto"><h1>Martin's Funerals</h1><h2>{{app.first_names}} {{app.surname}} — Replacement documents</h2><p>Your signed application forms remain saved. Upload only the supporting documents staff asked you to replace.</p>{% if error %}<p role="alert">{{error}}</p>{% endif %}{% for message in get_flashed_messages() %}<p>{{message}}</p>{% endfor %}<form method="post" enctype="multipart/form-data"><input type="hidden" name="nonce" value="{{nonce}}"><input type="hidden" name="action" value="replace"><p><label>ID document <input type="file" name="id_copy" accept=".pdf,.jpg,.png,.jpeg,.webp"></label></p><p><label>Proof of address <input type="file" name="proof_of_address" accept=".pdf,.jpg,.png,.jpeg,.webp"></label></p><button>Upload replacements for review</button></form></body></html>
