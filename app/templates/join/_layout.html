<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Martin's Funerals Online Application</title>
<style>body{margin:0;background:#f5f3f7;color:#29242d;font:16px/1.45 Arial,sans-serif}.shell{max-width:760px;margin:0 auto;padding:24px 16px}.card{background:#fff;border-radius:20px;padding:26px;box-shadow:0 12px 35px #39284b18}h1{color:#6d3f91;margin-top:0}.muted{color:#746d78}.grid{display:grid;gap:16px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{box-sizing:border-box;width:100%;padding:13px;border:1px solid #cabfd1;border-radius:10px;font-size:16px}.button{display:inline-block;border:0;border-radius:10px;padding:13px 20px;background:#168a55;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.product{border:1px solid #ddd3e3;border-radius:14px;padding:18px;margin:14px 0}.error{background:#ffe4e4;color:#8b1717;padding:12px;border-radius:10px;margin-bottom:16px}@media(min-width:620px){.two{grid-template-columns:1fr 1fr}}</style></head><body><main class="shell"><div class="card">{% block join_content %}{% endblock %}</div></main></body></html>
