{% extends "join/_layout.html" %}{% block join_content %}<h1>Find your family cover</h1><p class="muted">Enter the details below and we will show products matching your requirements.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" class="grid"><div class="field"><label>South African ID number</label><input name="id_number" inputmode="numeric" maxlength="13" value="{{ values.id_number }}" required></div><div class="grid two"><div class="field"><label>Total members</label><input name="total_members" type="number" min="1" max="11" value="{{ values.total_members }}" required><small>Include the main member.</small></div><div class="field"><label>Cover amount</label><select name="cover_amount" required><option value="">Choose cover</option>{% for cover in cover_options %}<option value="{{ cover }}" {% if values.cover_amount == cover|string %}selected{% endif %}>R {{ "{:,.2f}".format(cover) }}</option>{% endfor %}</select></div></div><button class="button" type="submit">SHOW PRODUCTS</button></form>{% endblock %}
